<!DOCTYPE html><html><head><meta charset="utf-8"><style>
@font-face { font-family:'Orbitron'; src:url('../fonts/Orbitron-900.ttf'); font-weight:900; }
@font-face { font-family:'Inter'; src:url('../fonts/Inter-400.ttf'); font-weight:400; }
@font-face { font-family:'Inter'; src:url('../fonts/Inter-700.ttf'); font-weight:700; }
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1920px; height:1080px; position:relative; overflow:hidden;
  background:#101a55; font-family:'Inter',sans-serif; }
.bg { position:absolute; inset:0; width:1920px; height:1080px; object-fit:cover; }
.scrim { position:absolute; inset:0;
  background:radial-gradient(1000px 500px at 30% 30%, rgba(5,7,22,.55) 0%, rgba(5,7,22,0) 70%); }
.left { position:absolute; left:80px; top:80px; width:820px; }
.left h2 { font-family:'Orbitron',sans-serif; font-weight:900; font-size:66px; line-height:1.3;
  background:linear-gradient(93deg,#7aa8ff 0%,#3b82f6 40%,#06b6d4 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent; -webkit-text-fill-color:transparent;
  filter:drop-shadow(0 4px 22px rgba(0,0,0,.8)); }
.left .rh { margin-top:36px; font-family:'Orbitron',sans-serif; font-weight:900; font-size:42px;
  color:#fff; letter-spacing:2px; text-shadow:0 4px 20px rgba(0,0,0,.9); }
.g3d { position:relative; margin-top:22px; }
.g3d .depth { position:absolute; left:14px; top:14px; right:-14px; bottom:-14px; border-radius:20px;
  background:linear-gradient(135deg, #31429e 0%, #1a2568 55%, #0d1338 100%);
  box-shadow:0 18px 44px rgba(0,0,0,.45); }
.g3d .glass { position:relative; border-radius:20px; padding:30px 38px;
  background:linear-gradient(165deg, rgba(255,255,255,.16), rgba(255,255,255,.05) 40%, rgba(20,26,70,.55));
  border:1px solid rgba(170,190,255,.4);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.35), inset 0 -4px 12px rgba(0,0,0,.3),
    inset 2px 0 0 rgba(255,255,255,.12); }
.glass .p1 { font-size:31px; font-weight:700; color:#8b7cf8;
  text-shadow:0 2px 12px rgba(0,0,0,.8); }
.glass .p2 { margin-top:10px; font-size:28px; color:#dfe4fa; letter-spacing:1px;
  text-shadow:0 2px 12px rgba(0,0,0,.9); }
.glass ul { list-style:none; }
.glass li { font-size:28px; color:#e8ebfb; line-height:1.9; padding-left:28px; position:relative;
  text-shadow:0 2px 12px rgba(0,0,0,.9); }
.glass li::before { content:'\2022'; position:absolute; left:0; color:#22d3ee; font-size:32px; }
.right { position:absolute; left:1000px; top:140px; width:840px; }
.right .frame { width:840px; height:800px; border-radius:28px; overflow:hidden;
  border:2px solid rgba(150,170,255,.4);
  box-shadow:0 24px 70px rgba(0,0,0,.55), 0 0 60px rgba(60,120,255,.35); }
.right .frame img { width:100%; height:100%; object-fit:cover; }
</style></head><body>
<img class="bg" src="../evolution-background-v3.png">
<div class="scrim"></div>
<div class="left">
  <h2>The Other Side of data-stage="1"<br>the Network</h2>
  <div class="rh" data-stage="2">RHODEUM MINER</div>
  <div class="g3d" data-stage="3"><div class="depth"></div><div class="glass">
    <div class="p1">Creates real-world data</div>
    <div class="p2">RHODEUM NETWORK</div>
  </div></div>
  <div class="rh" style="margin-top:34px;" data-stage="2">RHODEUM BEACON</div>
  <div class="g3d" data-stage="3"><div class="depth"></div><div class="glass">
    <ul>
      <li>Provides decentralized infrastructure</li>
      <li>Miner = Edge / Physical Activity</li>
      <li>Beacon = Network / Compute Infrastructure</li>
    </ul>
  </div></div>
</div>
<div class="right" data-stage="3">
  <div class="frame"><img src="../files/1000011612_43_xf9a.jpg"></div>
</div>
</body></html>
