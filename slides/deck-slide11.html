<!DOCTYPE html><html><head><meta charset="utf-8"><style>
@font-face { font-family:'Orbitron'; src:url('../fonts/Orbitron-900.ttf'); font-weight:900; }
@font-face { font-family:'Inter'; src:url('../fonts/Inter-400.ttf'); font-weight:400; }
@font-face { font-family:'Inter'; src:url('../fonts/Inter-700.ttf'); font-weight:700; }
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1920px; height:1080px; position:relative; overflow:hidden;
  background:#101a55; font-family:'Inter',sans-serif; }
.bg { position:absolute; inset:0; width:1920px; height:1080px; object-fit:cover; }
.scrim { position:absolute; inset:0;
  background:radial-gradient(1000px 500px at 30% 20%, rgba(5,7,22,.6) 0%, rgba(5,7,22,0) 70%); }
.head { position:absolute; left:80px; top:70px; width:800px; }
.head h2 { font-family:'Orbitron',sans-serif; font-weight:900; font-size:62px; line-height:1.35;
  background:linear-gradient(93deg,#7aa8ff 0%,#3b82f6 40%,#06b6d4 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent; -webkit-text-fill-color:transparent;
  filter:drop-shadow(0 4px 22px rgba(0,0,0,.8)); }
.head .sub { margin-top:20px; font-size:32px; line-height:1.5; color:#f2f4ff; font-weight:700;
  text-shadow:0 3px 16px rgba(0,0,0,.9); }
.cards { position:absolute; left:80px; top:440px; width:900px; height:420px; }
.card3d { position:absolute; width:480px; }
.card3d .depth { position:absolute; left:12px; top:12px; right:-12px; bottom:-12px; border-radius:26px;
  background:linear-gradient(135deg, #31429e 0%, #1a2568 55%, #0d1338 100%);
  box-shadow:0 18px 44px rgba(0,0,0,.5); }
.card3d .shine { position:relative; border-radius:26px; padding:38px 40px; overflow:hidden;
  border:1px solid rgba(180,200,255,.45);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.5), inset 0 -8px 20px rgba(0,0,0,.3),
    inset 3px 0 0 rgba(255,255,255,.18); }
.card3d .shine::before { content:''; position:absolute; top:0; left:0; right:0; height:55%;
  background:linear-gradient(180deg, rgba(255,255,255,.28), rgba(255,255,255,0));
  border-radius:26px 26px 50% 50%; pointer-events:none; }
.card3d.dark .shine { background:linear-gradient(165deg, #232c5e 0%, #141a3e 60%, #0b0f28 100%); }
.card3d.blue .shine { background:linear-gradient(160deg, #5ec8f5 0%, #2f9df2 55%, #1a63d8 100%); }
.card3d .t1 { font-size:36px; font-weight:700; color:#22d3ee; position:relative;
  text-shadow:0 2px 12px rgba(0,0,0,.4); }
.card3d.blue .t1 { color:#fff; text-shadow:0 3px 12px rgba(0,0,0,.4); }
.card3d .t2 { margin-top:10px; font-size:30px; color:#f2f4ff; position:relative;
  text-shadow:0 2px 12px rgba(0,0,0,.5); }
.card3d.dark .t2 { color:#e8ebfb; }
.today { position:absolute; left:1000px; top:55px; width:840px; text-align:center; }
.today .tw { font-family:'Orbitron',sans-serif; font-weight:900; font-size:100px; letter-spacing:6px;
  color:#fff; text-shadow:0 6px 30px rgba(0,0,0,.9), 0 0 60px rgba(120,140,255,.5); }
.today img { margin-top:16px; width:840px;
  filter:drop-shadow(0 0 50px rgba(120,140,255,.7)) drop-shadow(0 18px 36px rgba(0,0,0,.5)); }
.foot { position:absolute; left:80px; bottom:70px; font-size:30px; line-height:1.7; color:#e8ebfb;
  text-shadow:0 3px 14px rgba(0,0,0,.9); }
</style></head><body>
<img class="bg" src="../evolution-background-v3.png">
<div class="scrim"></div>
<div class="head">
  <h2>THE BEACON HAS data-stage="1"<br>UTILITY TODAY</h2>
  <div class="sub" data-stage="2">Build Tomorrow&rsquo;s Infrastructure While Working Today</div>
</div>
<div class="cards" data-stage="3">
  <div class="card3d dark" style="left:0; top:0;">
    <div class="depth"></div>
    <div class="shine"><div class="t1">MONERO</div><div class="t2">CPU Mining</div></div>
  </div>
  <div class="card3d blue" style="left:230px; top:110px;">
    <div class="depth"></div>
    <div class="shine"><div class="t1">SOLANA Network</div><div class="t2">Validation Architecture</div></div>
  </div>
  <div class="card3d dark" style="left:460px; top:220px;">
    <div class="depth"></div>
    <div class="shine"><div class="t1">RHODEUM OS</div><div class="t2">Upgradeable Infrastructure</div></div>
  </div>
</div>
<div class="today" data-stage="3">
  <div class="tw">TODAY</div>
  <img src="../assets/rhodeum-beacon-transparent.png">
</div>
<div class="foot" data-stage="3">12-25W Average Load<br>Plug In &bull; Connect &bull; Operate 24/7</div>
</body></html>
