<!DOCTYPE html><html><head><meta charset="utf-8"><style>
@font-face { font-family:'Orbitron'; src:url('../fonts/Orbitron-900.ttf'); font-weight:900; }
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1920px; height:1080px; position:relative; overflow:hidden; background:#101a55; }
.bg { position:absolute; inset:0; width:1920px; height:1080px; object-fit:cover; }
.scrim { position:absolute; inset:0;
  background:radial-gradient(1000px 500px at 50% 40%, rgba(5,7,22,.5) 0%, rgba(5,7,22,0) 70%); }
.wrap { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
  justify-content:center; }
h1 { font-family:'Orbitron',sans-serif; font-weight:900; font-size:110px; letter-spacing:3px;
  text-align:center; line-height:1.3;
  background:linear-gradient(93deg,#9db9ff 0%,#5b8cff 35%,#22d3ee 70%,#8b5cf6 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent; -webkit-text-fill-color:transparent;
  filter:drop-shadow(0 6px 30px rgba(0,0,0,.85)); }
img.q { margin-top:50px; width:440px;
  filter:drop-shadow(0 0 70px rgba(120,140,255,.75)) drop-shadow(0 24px 48px rgba(0,0,0,.5)); }
</style></head><body>
<img class="bg" src="../evolution-background-v3.png">
<div class="scrim"></div>
<div class="wrap">
  <h1>Now Open for Questions</h1 data-stage="1">
  <img class="q" data-stage="2" src="../art/slide5-question-v1.png">
</div>
</body></html>
