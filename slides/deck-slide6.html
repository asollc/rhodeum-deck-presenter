<!DOCTYPE html><html><head><meta charset="utf-8"><style>
@font-face { font-family:'Orbitron'; src:url('../fonts/Orbitron-900.ttf'); font-weight:900; }
@font-face { font-family:'Inter'; src:url('../fonts/Inter-400.ttf'); font-weight:400; }
@font-face { font-family:'Inter'; src:url('../fonts/Inter-700.ttf'); font-weight:700; }
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1920px; height:1080px; position:relative; overflow:hidden;
  background:#101a55; font-family:'Inter',sans-serif; }
.bg { position:absolute; inset:0; width:1920px; height:1080px; object-fit:cover; }
.scrim { position:absolute; inset:0;
  background:radial-gradient(1100px 480px at 50% 6%, rgba(5,7,22,.62) 0%, rgba(5,7,22,0) 70%); }
.head { position:absolute; top:52px; left:0; width:1920px; text-align:center; }
.head h2 { font-family:'Orbitron',sans-serif; font-weight:900; font-size:62px; letter-spacing:2px;
  background:linear-gradient(93deg,#7aa8ff 0%,#3b82f6 40%,#06b6d4 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent; -webkit-text-fill-color:transparent;
  filter:drop-shadow(0 4px 22px rgba(0,0,0,.8)); }
.head .sub { margin-top:14px; font-size:33px; color:#fff; font-weight:700;
  text-shadow:0 3px 16px rgba(0,0,0,.9); }
.pcard { position:absolute; top:250px; width:520px; height:680px; border-radius:28px;
  border:2px solid rgba(255,255,255,.5);
  box-shadow:0 20px 60px rgba(0,0,0,.45), 0 0 50px rgba(90,140,255,.4);
  display:flex; align-items:center; justify-content:center; }
.pcard.blue { background:linear-gradient(150deg, #6fd3f7 0%, #2f9df2 50%, #1a63d8 100%); }
.pcard.bluepurple { background:linear-gradient(150deg, #7aa8ff 0%, #5b6cf0 48%, #8b5cf6 100%); }
.pcard img { filter:drop-shadow(0 14px 30px rgba(30,20,80,.45)); }
.words { position:absolute; left:660px; top:250px; width:600px; height:680px; border-radius:28px;
  padding:52px 48px;
  background:linear-gradient(165deg, rgba(255,255,255,.13), rgba(255,255,255,.04) 40%, rgba(20,26,70,.6));
  border:1px solid rgba(170,190,255,.35);
  box-shadow:0 18px 50px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.22);
  display:flex; flex-direction:column; justify-content:center; }
.words .w1 { font-size:34px; font-weight:700; color:#fff;
  text-shadow:0 3px 14px rgba(0,0,0,.9); }
.words .w2 { margin-top:8px; font-size:28px; color:#d5dbf7;
  text-shadow:0 2px 12px rgba(0,0,0,.9); }
.words .down { font-size:52px; color:#22d3ee; margin:22px 0 22px 8px;
  text-shadow:0 0 24px rgba(34,211,238,.8); }
.words .cap { margin-top:34px; font-size:24px; font-weight:700; letter-spacing:1px; color:#fff;
  text-shadow:0 2px 12px rgba(0,0,0,.9); }
.words .tags { margin-top:16px; font-size:25px; line-height:2; color:#c9d2f8;
  text-shadow:0 2px 12px rgba(0,0,0,.9); }
.words .tags b { color:#22d3ee; font-weight:400; }
</style></head><body>
<img class="bg" src="../evolution-background-v3.png">
<div class="scrim"></div>
<div class="head">
  <h2>FROM POWER TOOL TO SMART TOOL</h2 data-stage="1">
  <div class="sub" data-stage="2">Years of Research &amp; Development</div>
</div>
<div class="pcard data-stage="3" blue" style="left:80px;">
  <img src="../assets/ultralift-crank-transparent.png" width="440">
</div>
<div class="words" data-stage="3">
  <div class="w1">Ultralift 1.0</div>
  <div class="w2">Automate The Physical Work</div>
  <div class="down">&#8595;</div>
  <div class="w1">Smart Tool / Rhodeum Miner</div>
  <div class="cap">CAPTURE THE WORK + DATA</div>
  <div class="tags">TIME <b>|</b> LOCATION <b>|</b> TOOL USAGE <b>|</b> TORQUE <b>|</b> ROTATIONS <b>|</b> TRAILER ACTIVITY</div>
</div>
<div class="pcard data-stage="3" bluepurple" style="left:1320px;">
  <img src="../assets/rhodeum-tool-transparent.png" width="440">
</div>
</body></html>
